await-holding-invalid-types = [
  { path = "stdext::panic::CatchBoundary", reason = "the boundary state is thread-local. Use `crate::panic::catch_unwind_async()` for async code" },
]

disallowed-methods = [
  { path = "std::panic::catch_unwind", reason = "use `crate::panic::catch_unwind()` or its payload and async variants to declare the boundary Ark's panic hook checks before aborting" },
  { path = "tokio::spawn", reason = "use `crate::panic::spawn()` or an explicit per-poll panic boundary. Ark's panic hook aborts on panics outside a recovery boundary" },
]

name: "Test Ark - Windows"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    name: "Rust: ${{ matrix.config.rust }}, R: ${{ matrix.config.r }}, OS: ${{ matrix.config.runs_on }}"
    runs-on: ${{ matrix.config.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # x64
          # TEMPORARY: x64 disabled while investigating arm64 repos
          # - { rust: 'stable', r: 'release', runs_on: 'windows-latest' }
          # arm64
          - { rust: 'stable', r: 'release', runs_on: 'windows-11-arm' }
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # R packages required for tests. Shared by both install paths below.
      R_TEST_PACKAGES: >-
        data.table
        dplyr
        haven
        htmltools
        R6
        ragg
        readr
        renv
        rstudioapi
        S7
        tibble
    steps:
      - uses: actions/checkout@v4

      - name: Report Rust Toolchain
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          # Putting Rtools related tooling on the PATH causes Rust crate
          # compilation to pick up Rtools's MinGW tooling, in particular it can
          # cause ring (used by ureq) compilation to fail on ARM Windows, where
          # it uses clang and has to compile in a bunch of C code.
          # https://github.com/briansmith/ring/blob/main/BUILDING.md
          windows-path-include-rtools: false

      # TEMPORARY: find out where the arm64 R installation gets its
      # cran.r-universe.dev repo from. `--vanilla` skips the site and user
      # profiles (including the one setup-r writes), so any repo still set
      # here comes from the R installation itself.
      - name: Show where the default repos come from (arm64, TEMPORARY)
        if: runner.arch == 'ARM64'
        shell: Rscript --vanilla {0}
        run: |
          cat("R.version.string: ", R.version.string, "\n", sep = "")
          cat("R.home(): ", R.home(), "\n", sep = "")
          cat("R_REPOSITORIES env var: ", Sys.getenv("R_REPOSITORIES", "<unset>"), "\n", sep = "")

          cat("::group::getOption('repos') with --vanilla\n")
          print(getOption("repos"))
          cat("::endgroup::\n")

          show_file <- function(path) {
            cat("::group::", path, "\n", sep = "")
            if (nzchar(path) && file.exists(path)) {
              writeLines(readLines(path))
            } else {
              cat("<does not exist>\n")
            }
            cat("::endgroup::\n")
          }
          show_file(file.path(R.home("etc"), "repositories"))
          show_file(file.path(R.home("etc"), "Rprofile.site"))
          show_file(Sys.getenv("R_PROFILE"))
          show_file(file.path(Sys.getenv("USERPROFILE"), "Documents", ".Rprofile"))

          cat("::group::Files in R.home('etc')\n")
          print(list.files(R.home("etc"), recursive = TRUE))
          cat("::endgroup::\n")

      - name: Install R Packages Required For Tests
        if: runner.arch != 'ARM64'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: ${{ env.R_TEST_PACKAGES }}

      # On windows-11-arm, pak treats the default CRAN repo (cran.r-universe.dev,
      # set by the R arm64 build) as source-only and builds every package from
      # source (~20 min, mostly stringi). It also never reuses those packages
      # from the `setup-r-dependencies` cache, so it pays that cost on every run.
      # `install.packages()` gets r-universe's arm64 binaries instead, which
      # takes seconds, so no cache is needed.
      - name: Install R Packages Required For Tests (arm64)
        if: runner.arch == 'ARM64'
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))

          pkgs <- strsplit(Sys.getenv("R_TEST_PACKAGES"), "[[:space:]]+")[[1]]
          install.packages(pkgs, lib = lib)

          # `install.packages()` only warns on failure, so check explicitly
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing)) {
            stop("Failed to install: ", paste(missing, collapse = ", "))
          }

      - name: Build
        run: |
          cargo build

      - name: Run Tests
        env:
          NEXTEST_PROFILE: "ci"
          R_PROFILE_USER: ${{ github.workspace }}/.github/Rprofile
        run: |
          cargo nextest run

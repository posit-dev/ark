name: "Test Ark - Windows"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    name: "Rust: ${{ matrix.config.rust }}, R: ${{ matrix.config.r }}, OS: ${{ matrix.config.runs_on }}"
    runs-on: ${{ matrix.config.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # x64
          - { rust: 'stable', r: 'release', runs_on: 'windows-latest' }
          # arm64
          - { rust: 'stable', r: 'release', runs_on: 'windows-11-arm' }
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Report Rust Toolchain
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          # Putting Rtools related tooling on the PATH causes Rust crate
          # compilation to pick up Rtools's MinGW tooling, in particular it can
          # cause ring (used by ureq) compilation to fail on ARM Windows, where
          # it uses clang and has to compile in a bunch of C code.
          # https://github.com/briansmith/ring/blob/main/BUILDING.md
          windows-path-include-rtools: false

      - name: Install R Packages Required For Tests
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Revert to release pak: https://github.com/posit-dev/ark/issues/1471
          pak-version: devel
          dependencies: '"hard"'
          packages:
            data.table
            dplyr
            haven
            htmltools
            R6
            ragg
            readr
            renv
            rstudioapi
            S7
            tibble

      - name: Build
        run: |
          cargo build

      # The first ragg render on a fresh Windows runner can stall machine-wide
      # for 20-60s+, which made the first plot tests hit `RECV_TIMEOUT`. Pay
      # that cost here, and time each phase so we can see where it lands. The
      # second process shows whether the cost is per-process or machine-wide.
      - name: Warm up ragg graphics stack (timed)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Now:    $(Get-Date -Format o)"
          Write-Host "Booted: $($os.LastBootUpTime.ToString('o'))"
          Write-Host ("Uptime: {0:N0}s" -f ((Get-Date) - $os.LastBootUpTime).TotalSeconds)

          $script = Join-Path $env:RUNNER_TEMP "warm-ragg.R"
          @'
          timed <- function(label, expr) {
            start <- format(Sys.time(), "%H:%M:%OS3")
            elapsed <- system.time(expr)[["elapsed"]]
            cat(sprintf("[%s] %-42s %7.2fs\n", start, label, elapsed))
          }

          render <- function() {
            path <- tempfile(fileext = ".png")
            ragg::agg_png(path, width = 504, height = 504, res = 72)
            plot(1:10, main = "warm-up")
            grDevices::dev.off()
            unlink(path)
          }

          timed("loadNamespace(systemfonts)", loadNamespace("systemfonts"))
          timed("loadNamespace(textshaping)", loadNamespace("textshaping"))
          timed("loadNamespace(ragg)", loadNamespace("ragg"))
          timed("systemfonts::system_fonts() (font scan)", fonts <- systemfonts::system_fonts())
          cat("Fonts found:", nrow(fonts), "\n")
          timed("first ragg render", render())
          timed("second ragg render", render())
          '@ | Set-Content -Path $script

          foreach ($i in 1..2) {
            Write-Host "--- Rscript process $i ---"
            $elapsed = Measure-Command { Rscript $script | Out-Host }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host ("Process {0} wall time: {1:N2}s" -f $i, $elapsed.TotalSeconds)
          }

          # Metadata only, so this doesn't warm font file contents
          $fontFiles = Get-ChildItem "$env:WINDIR\Fonts" -File
          $fontMB = ($fontFiles | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("$env:WINDIR\Fonts: {0} files, {1:N0} MB" -f $fontFiles.Count, $fontMB)

      - name: Run Tests
        env:
          NEXTEST_PROFILE: "ci"
          R_PROFILE_USER: ${{ github.workspace }}/.github/Rprofile
        run: |
          cargo nextest run
